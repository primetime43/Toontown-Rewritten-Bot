changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: "New Features"
      labels:
        - feature
        - enhancement
    - title: "Bug Fixes"
      labels:
        - bug
        - fix
    - title: "Improvements"
      labels:
        - improvement
        - refactor
        - performance
    - title: "Documentation"
      labels:
        - documentation
        - docs
    - title: "Security"
      labels:
        - security
    - title: "Other Changes"
      labels:
        - "*"
